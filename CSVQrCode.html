<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génération du fichier CSV</title>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f5f7fa;
            color: #242424;
            margin: 0;
            padding: 32px;
        }

        .container {
            max-width: 620px;
            margin: 40px auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        #status {
            margin: 16px 0;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            background: #0f6cbd;
            color: #ffffff;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #115ea3;
        }

        .error {
            color: #a4262c;
        }

        .success {
            color: #107c10;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Export des QR Codes</h1>
        <p id="status">Préparation du fichier CSV…</p>
        <a id="downloadLink" class="button" style="display: none;">
            Télécharger le CSV
        </a>
    </main>

    <script>
        (() => {
            const statusElement = document.getElementById("status");
            const downloadLink = document.getElementById("downloadLink");

            function csvCell(value) {
                const text = value === null || value === undefined
                    ? ""
                    : String(value);

                // Échappement CSV : les guillemets sont doublés.
                return '"' + text.replace(/"/g, '""') + '"';
            }

            function generateCsv() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const jsonData = params.get("data");

                    if (!jsonData) {
                        throw new Error("Le paramètre « data » est absent de l’URL.");
                    }

                    const rows = JSON.parse(jsonData);

                    if (!Array.isArray(rows)) {
                        throw new Error("Les données reçues ne sont pas une liste valide.");
                    }

                    const headers = ["ID", "Emplacement", "ContenuQr"];
                    const csvLines = [
                        headers.map(csvCell).join(";"),
                        ...rows.map(row => [
                            csvCell(row.ID),
                            csvCell(row.Emplacement),
                            csvCell(row.ContenuQr)
                        ].join(";"))
                    ];

                    // BOM UTF-8 pour améliorer l’ouverture des accents dans Excel.
                    const csvContent = "\uFEFF" + csvLines.join("\r\n");
                    const blob = new Blob(
                        [csvContent],
                        { type: "text/csv;charset=utf-8;" }
                    );

                    const blobUrl = URL.createObjectURL(blob);

                    downloadLink.href = blobUrl;
                    downloadLink.download = "export_qrcodes.csv";
                    downloadLink.style.display = "inline-block";

                    statusElement.textContent =
                        rows.length + " ligne(s) prête(s) pour l’export.";

                    statusElement.className = "success";

                    // Lancement automatique du téléchargement.
                    downloadLink.click();

                    // Le lien reste disponible si le navigateur bloque
                    // le téléchargement automatique.
                    window.setTimeout(() => {
                        URL.revokeObjectURL(blobUrl);
                    }, 60000);

                } catch (error) {
                    statusElement.textContent =
                        "Impossible de générer le CSV : " + error.message;

                    statusElement.className = "error";
                }
            }

            generateCsv();
        })();
    </script>
</body>
</html>
