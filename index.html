<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8"/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
margin:0;
padding:0;
}

#map{
width:100%;
height:100vh;
}

</style>

</head>


<body>

<div id="map"></div>

<script>

/* RÉCUPÉRATION PARAMÈTRE URL */

var urlParams = new URLSearchParams(window.location.search);
var pointsParam = urlParams.get("points");

var points = [];

/* PARSE JSON */

if(pointsParam){

    try{

        points = JSON.parse(pointsParam);

    }
    catch(e){

        console.error("Erreur parsing JSON",e);

    }

}

/* FILTRE COORDONNÉES INVALIDES */

points = points.filter(function(p){

    return p.lat !== null &&
           p.lng !== null &&
           !isNaN(p.lat) &&
           !isNaN(p.lng);

});

/* POINT PAR DÉFAUT */

if(points.length === 0){

    points = [
        {lat:48.8566,lng:2.3522,nom:"Paris défaut",rayon:3}
    ];

}

/* INITIALISATION CARTE */

var map = L.map("map").setView(
    [points[0].lat,points[0].lng],
    9
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{attribution:"© OpenStreetMap"}
).addTo(map);


/* AJOUT POINTS */

var bounds = [];

points.forEach(function(p){

    L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup("<b>"+p.nom+"</b>");

    if(p.rayon){

        L.circle([p.lat,p.lng],{

            radius:p.rayon*1000,
            color:"blue",
            fillColor:"#3388ff",
            fillOpacity:0.15,
            weight:2

        }).addTo(map);

    }

    bounds.push([p.lat,p.lng]);

});


/* ZOOM AUTOMATIQUE */

if(bounds.length>1){

    map.fitBounds(bounds,{padding:[50,50]});

}

</script>

</body>
</html>
