<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8"/>

<title>Carte Points PowerApps</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>

body{
margin:0;
padding:0;
}

#map{
width:100%;
height:100vh;
}

.popup-site{
font-family: Arial, sans-serif;
}

.popup-besoin{
font-family: Arial, sans-serif;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

/* récupération paramètre URL */

var urlParams = new URLSearchParams(window.location.search);
var pointsParam = urlParams.get("points");

/* sinon LocalStorage */

if(!pointsParam){
pointsParam = localStorage.getItem("mapPoints");
}

var points = [];

if(pointsParam){

try{
points = JSON.parse(decodeURIComponent(pointsParam));
}
catch(e){
console.error("Erreur JSON :",e);
}

}

/* filtrage coordonnées */

points = points.filter(function(p){

return p.lat !== null &&
p.lng !== null &&
!isNaN(p.lat) &&
!isNaN(p.lng);

});

/* point par défaut */

if(points.length === 0){

points = [
{
type:"besoin",
lat:48.8566,
lng:2.3522,
nom:"Paris",
distance:20,
nbAgents:3,
periode:"Test",
duree:5,
up:"UP1"
}
];

}

/* création carte */

var map = L.map("map").setView(
[points[0].lat,points[0].lng],
7
);

/* fond de carte */

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

/* groupe cluster */

var markers = L.markerClusterGroup();

/* fonction couleur automatique */

function getColor(p){

if(p.color){
return p.color;
}

if(p.nbAgents >= 10){
return "#d73027";
}

if(p.nbAgents >= 5){
return "#ff9800";
}

return "#2e7d32";

}

/* fonction génération popup selon type */

function getPopupContent(p){

var type = p.type || "site";

if(type === "besoin"){
return "<div class='popup-besoin'>"+
"<b>🎯 BESOIN - "+(p.nom || "")+"</b><br><br>"+
"📏 Rayon : "+(p.distance || 0)+" km<br>"+
"📅 Période : "+(p.periode || "")+"<br>"+
"⏱ Durée : "+(p.duree || "")+" jours<br>"+
"👷 Agents : "+(p.nbAgents || "")+"<br>"+
"🏢 UP : "+(p.up || "")+
"</div>";
}
else{
return "<div class='popup-site'>"+
"<b>🏢 SITE - "+(p.nom || p.siteITIF || "")+"</b><br><br>"+
"🆔 Site ITIF : "+(p.siteITIF || "")+"<br>"+
"✅ Statut : "+(p.actif || "")+"<br>"+
"👥 Effectif : "+(p.effectif || "")+"<br>"+
"📐 Superficie : "+(p.superficie || "")+" m²<br>"+
"🔢 ID IMMOSIS : "+(p.idImmosis || "")+"<br>"+
"🏢 UP : "+(p.up || "")+
"</div>";
}

}

/* limites carte */

var bounds = [];

/* ajout points */

points.forEach(function(p){

var color = getColor(p);

var icon = L.divIcon({
className:"custom-icon",
html:'<div style="background:'+color+';width:14px;height:14px;border-radius:50%;border:2px solid white;"></div>',
iconSize:[18,18]
});

var marker = L.marker(
[p.lat,p.lng],
{icon:icon}
).bindPopup(getPopupContent(p));

markers.addLayer(marker);

bounds.push([p.lat,p.lng]);

/* cercle distance */

if(p.distance && p.distance > 0){

L.circle(
[p.lat,p.lng],
{
radius:p.distance*1000,
color:color,
fillColor:color,
fillOpacity:0.15
}
).addTo(map);

}

});

/* ajout cluster */

map.addLayer(markers);

/* zoom auto */

if(bounds.length > 1){
map.fitBounds(bounds,{padding:[40,40]});
}

</script>

</body>

</html>
