<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8"/>

<title>Carte Points PowerApps</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
margin:0;
padding:0;
}

#map{
width:100%;
height:100vh;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

/* récupération paramètre URL */

var urlParams = new URLSearchParams(window.location.search);
var pointsParam = urlParams.get("points");

var points = [];

/* lecture JSON envoyé par PowerApps */

if(pointsParam){

    try{

        points = JSON.parse(pointsParam);

    }
    catch(e){

        console.error("Erreur JSON :",e);

    }

}

/* sécurité : suppression coordonnées invalides */

points = points.filter(function(p){

    return p.lat !== null &&
           p.lng !== null &&
           !isNaN(p.lat) &&
           !isNaN(p.lng);

});

/* point par défaut si rien reçu */

if(points.length === 0){

    points = [
        {lat:48.8566,lng:2.3522,nom:"Paris"}
    ];

}

/* création carte */

var map = L.map("map").setView(
    [points[0].lat,points[0].lng],
    9
);

/* fond de carte */

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap contributors"
}
).addTo(map);


/* stockage des limites pour zoom auto */

var bounds = [];

/* ajout des points */

points.forEach(function(p){

    L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup("<b>"+p.nom+"</b>");

    bounds.push([p.lat,p.lng]);

});

/* zoom automatique sur tous les points */

if(bounds.length > 1){

    map.fitBounds(bounds,{padding:[40,40]});

}

</script>

</body>
</html>
