<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <p>Génération du ZIP en cours...</p>
  <script>
    const urlParams = new URLSearchParams(window.location.search);

    let qrData;
    try {
      // URLSearchParams.get() décode déjà une fois, pas besoin de decodeURIComponent()
      qrData = JSON.parse(urlParams.get('data'));
    } catch(e) {
      document.body.innerHTML = '<p>Erreur JSON : ' + e.message + '</p>';
      throw e;
    }

    const zip = new JSZip();

    Promise.all(
      qrData.map(async (item) => {
        const response = await fetch(item.QrUrl);
        const blob = await response.blob();
        zip.file(item.ID + '.png', blob);
      })
    )
    .then(() => zip.generateAsync({ type: 'blob' }))
    .then((content) => saveAs(content, 'qr_codes.zip'))
    .catch(err => {
      document.body.innerHTML = '<p>Erreur téléchargement : ' + err.message + '</p>';
    });
  </script>
</body>
</html>
